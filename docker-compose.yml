# =============================================================================
# Event-Sourced Ledger — full local stack
# =============================================================================
#   docker compose up --build
#
# Services (7):
#   postgres          PostgreSQL 17 (named volume, healthchecked)
#   banking-backend   event-sourced monolith + ledger API        :5000
#   identity-service  registration / login / JWT issuance        :5001
#   customer-service  customer profile ownership                 :5002
#   notification-service consent-aware email notifications        :5003
#   api-gateway       single browser-facing entry point          :4000
#   frontend          React (Vite) build served by nginx         :5173
#
# Service-to-service traffic uses Docker DNS names; nginx proxies same-origin
# browser API requests to the Gateway over the Compose network.
#
# NOTE: this file lives at the repository root because the root of this
# repository IS the backend (package.json name = "backend"); there is no
# separate backend/ directory.
#
# No `version:` key on purpose — Compose v2 ignores it and warns that it is
# obsolete.
# =============================================================================

# -----------------------------------------------------------------------------
# Shared configuration
# -----------------------------------------------------------------------------

# Secrets shared by the services that issue or verify tokens or internal calls.
# They are read from the host environment or the root .env file (Compose loads
# .env automatically for ${...} substitution). The fallbacks below are
# development-only placeholders so a fresh clone can boot with a single command;
# set real values in .env for anything beyond local development.
x-shared-app-secrets: &shared-app-secrets
  JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-jwt-secret-change-me-32chars}
  JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-24}
  CUSTOMER_PROVISIONING_SECRET: ${CUSTOMER_PROVISIONING_SECRET:-dev-only-insecure-provisioning-secret}

x-postgres-credentials: &postgres-credentials
  POSTGRES_USER: ${POSTGRES_USER:-ledger}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledger_dev_password}
  POSTGRES_DB: ${POSTGRES_DB:-ledger}

x-restart-policy: &restart-policy
  restart: unless-stopped

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL — the single database for the whole stack
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:17
    <<: *restart-policy
    environment:
      <<: *postgres-credentials
      # Keep the cluster's default locale deterministic.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      # Bound to the loopback interface only: reachable with `psql` for local
      # development, never published on the network. Do not change to "5432:5432"
      # unless you really want Postgres exposed.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - banking-network

  # ---------------------------------------------------------------------------
  # Customer Service — sole owner of customer profile reads and writes
  # ---------------------------------------------------------------------------
  customer-service:
    build:
      context: ./services/customer-service
      dockerfile: Dockerfile
    image: event-source-ledger/customer-service:local
    <<: *restart-policy
    environment:
      <<: *shared-app-secrets
      PORT: 5002
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-ledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledger_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-ledger}
      NOTIFICATION_CUSTOMER_LOOKUP_SECRET: ${NOTIFICATION_CUSTOMER_LOOKUP_SECRET:-dev-only-insecure-notification-contact-secret}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5002/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - banking-network

  # ---------------------------------------------------------------------------
  # Banking Backend — monolith. Also the SINGLE migration executor.
  # ---------------------------------------------------------------------------
  banking-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: event-source-ledger/banking-backend:local
    <<: *restart-policy
    environment:
      <<: *shared-app-secrets
      NODE_ENV: production
      PORT: 5000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CUSTOMER_SERVICE_URL: http://customer-service:5002
      # --- application database config (src/config/env.ts) ---
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-ledger}
      DATABASE_USER: ${POSTGRES_USER:-ledger}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-ledger_dev_password}
      # --- same credentials as PG* for node-pg-migrate & the entrypoint wait ---
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-ledger}
      PGPASSWORD: ${POSTGRES_PASSWORD:-ledger_dev_password}
      PGDATABASE: ${POSTGRES_DB:-ledger}
      # --- one-shot startup work, owned by this container only ---
      RUN_MIGRATIONS: "true"
      SEED_ON_START: "true"
      IDEMPOTENCY_TTL_SECONDS: ${IDEMPOTENCY_TTL_SECONDS:-3600}
      IDEMPOTENCY_CLEANUP_INTERVAL_MS: ${IDEMPOTENCY_CLEANUP_INTERVAL_MS:-3600000}
      OUTBOX_PUBLISHER_ENABLED: ${OUTBOX_PUBLISHER_ENABLED:-false}
      OUTBOX_SQS_QUEUE_URL: ${OUTBOX_SQS_QUEUE_URL:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      SCHEDULED_TRANSFER_WORKER_ENABLED: ${SCHEDULED_TRANSFER_WORKER_ENABLED:-true}
      SCHEDULED_TRANSFER_POLL_INTERVAL_MS: ${SCHEDULED_TRANSFER_POLL_INTERVAL_MS:-30000}
      SCHEDULED_TRANSFER_BATCH_SIZE: ${SCHEDULED_TRANSFER_BATCH_SIZE:-20}
      SCHEDULED_TRANSFER_MISFIRE_GRACE_SECONDS: ${SCHEDULED_TRANSFER_MISFIRE_GRACE_SECONDS:-300}
    ports:
      # Loopback only for local API debugging; customer endpoints are hosted by
      # Customer Service and are routed through the Gateway.
      - "127.0.0.1:5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # /ready verifies the database connection, /health does not.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      # Migrations + first-boot seed run before the server starts listening.
      start_period: 60s
    stop_grace_period: 20s
    networks:
      - banking-network

  # ---------------------------------------------------------------------------
  # Identity Service — registration, login, JWT, bcrypt
  # ---------------------------------------------------------------------------
  identity-service:
    build:
      context: ./services/identity-service
      dockerfile: Dockerfile
    image: event-source-ledger/identity-service:local
    <<: *restart-policy
    environment:
      <<: *shared-app-secrets
      PORT: 5001
      # --- identity-service/src/config/env.ts uses POSTGRES_*, not DATABASE_* ---
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-ledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledger_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-ledger}
      # Customer Service internal API; credentials come from the shared anchor.
      CUSTOMER_SERVICE_URL: http://customer-service:5002
      NODE_ENV: production
    ports:
      # Loopback only — browsers use the API gateway, never this service
      # directly. Kept published for local debugging; remove to make it
      # internal-only.
      - "127.0.0.1:5001:5001"
    depends_on:
      postgres:
        condition: service_healthy
      customer-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - banking-network

  # ---------------------------------------------------------------------------
  # Notification Service — consent-aware SQS consumer and SES delivery
  # ---------------------------------------------------------------------------
  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    image: event-source-ledger/notification-service:local
    <<: *restart-policy
    environment:
      PORT: 5003
      NODE_ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-ledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledger_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-ledger}
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-jwt-secret-change-me-32chars}
      CUSTOMER_SERVICE_URL: http://customer-service:5002
      NOTIFICATION_CUSTOMER_LOOKUP_SECRET: ${NOTIFICATION_CUSTOMER_LOOKUP_SECRET:-dev-only-insecure-notification-contact-secret}
      NOTIFICATION_CONSUMER_ENABLED: ${NOTIFICATION_CONSUMER_ENABLED:-false}
      NOTIFICATION_SQS_QUEUE_URL: ${NOTIFICATION_SQS_QUEUE_URL:-}
      NOTIFICATION_SES_ENABLED: ${NOTIFICATION_SES_ENABLED:-false}
      NOTIFICATION_SES_FROM_EMAIL: ${NOTIFICATION_SES_FROM_EMAIL:-}
      NOTIFICATION_MAX_ATTEMPTS: ${NOTIFICATION_MAX_ATTEMPTS:-5}
      NOTIFICATION_SQS_VISIBILITY_TIMEOUT_SECONDS: ${NOTIFICATION_SQS_VISIBILITY_TIMEOUT_SECONDS:-300}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    ports:
      - "127.0.0.1:5003:5003"
    depends_on:
      postgres:
        condition: service_healthy
      banking-backend:
        condition: service_healthy
      customer-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5003/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - banking-network

  # ---------------------------------------------------------------------------
  # API Gateway — the only entry point the browser talks to
  # ---------------------------------------------------------------------------
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    image: event-source-ledger/api-gateway:local
    <<: *restart-policy
    environment:
      PORT: 4000
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Internal Docker DNS names — never localhost.
      IDENTITY_SERVICE_URL: http://identity-service:5001
      CUSTOMER_SERVICE_URL: http://customer-service:5002
      BANKING_SERVICE_URL: http://banking-backend:5000
      NOTIFICATION_SERVICE_URL: http://notification-service:5003
    ports:
      - "4000:4000"
    depends_on:
      identity-service:
        condition: service_healthy
      customer-service:
        condition: service_healthy
      banking-backend:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - banking-network

  # ---------------------------------------------------------------------------
  # Frontend — static build served by nginx
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Use nginx as a same-origin reverse proxy to the Gateway.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    image: event-source-ledger/frontend:local
    <<: *restart-policy
    ports:
      - "5173:5173"
    depends_on:
      # Only ordering, not a health gate: the frontend is a static bundle and
      # does not call the gateway at build time (the API URL is baked in). Making
      # this `service_healthy` would let an API problem block the UI from loading.
      api-gateway:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - banking-network

# -----------------------------------------------------------------------------
# Named volume: keeps PostgreSQL data across `docker compose down` / `up`.
# Only `docker compose down -v` (or `docker volume rm`) removes it.
# -----------------------------------------------------------------------------
volumes:
  postgres_data:
    name: event-source-ledger_postgres_data

networks:
  banking-network:
    name: event-source-ledger_network
    driver: bridge
