# nginx configuration for the React frontend.
#
# Listens on 5173 and runs entirely as the unprivileged `nginx` user:
#   * no `user` directive  → the master process keeps the user it was started as
#   * pid / temp paths under /tmp → writable without root
#   * high port (5173) → no CAP_NET_BIND_SERVICE needed

worker_processes  auto;
pid               /tmp/nginx.pid;
error_log         /dev/stderr warn;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Temp paths must be writable by the non-root user.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Structured, container-friendly access logging.
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';
    access_log  /dev/stdout main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    # Vite emits pre-compressed-friendly assets; let nginx serve them gzipped.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/json application/javascript
                      application/x-javascript text/xml application/xml image/svg+xml;

    server {
        # Plain IPv4 listen on an unprivileged port: no CAP_NET_BIND_SERVICE and
        # no dependency on IPv6 being enabled inside the container.
        listen       5173;
        server_name  _;

        root   /usr/share/nginx/html;
        index  index.html;

        # Hashed Vite assets are immutable — cache them aggressively.
        location /assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # index.html must always be revalidated so new deploys are picked up.
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location /api/ {
            proxy_pass http://api-gateway:4000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /health {
            proxy_pass http://api-gateway:4000/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # SPA fallback: the app uses createBrowserRouter, so every client-side
        # route (/login, /customers, /accounts/:id, ...) must return the shell.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Container healthcheck target.
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }
    }
}
